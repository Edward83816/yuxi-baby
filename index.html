
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陳宇莃・彌月紀念</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f3ed;
  --paper:#fffdf9;
  --ink:#4b423b;
  --muted:#a09386;
  --line:#ded4c8;
  --soft:#fbf8f3;
  --shadow:0 22px 60px rgba(90,70,50,.10);
}

*{box-sizing:border-box;margin:0;padding:0;}

html{scroll-behavior:smooth;}

body{
  background:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.72), transparent 30%),
    radial-gradient(circle at 90% 18%, rgba(222,212,200,.35), transparent 28%),
    var(--bg);
  color:var(--ink);
  font-family:'Noto Serif TC',serif;
  font-weight:300;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.16) 1px, transparent 1px);
  background-size:42px 42px;
  opacity:.25;
}

.wrap{
  max-width:1280px;
  margin:auto;
  position:relative;
  z-index:1;
}

.reveal{
  opacity:0;
  transform:translateY(32px);
  transition:opacity 1s ease, transform 1s ease;
}

.reveal.show{
  opacity:1;
  transform:translateY(0);
}

@keyframes softFloat{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-12px) rotate(.45deg); }
}

@keyframes breathe{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.018); }
}

.hero{
  min-height:100vh;
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  align-items:center;
  padding:64px 7vw;
  gap:72px;
}

.hero-text{text-align:left;}

.label{
  font-size:12px;
  letter-spacing:.35em;
  color:var(--muted);
  margin-bottom:70px;
}

.label:before{
  content:"";
  display:inline-block;
  width:36px;
  height:1px;
  background:var(--line);
  margin-right:14px;
  vertical-align:middle;
}

.en{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--muted);
  font-size:20px;
  margin-bottom:24px;
}

.name{
  font-size:clamp(68px,9vw,136px);
  font-weight:400;
  letter-spacing:.18em;
  line-height:1;
  margin-bottom:34px;
}

.divider{
  width:70px;
  height:1px;
  background:var(--line);
  margin-bottom:28px;
}

.tag{
  font-size:14px;
  letter-spacing:.35em;
  color:#6f6359;
  margin-bottom:22px;
}

.date{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;
  letter-spacing:.16em;
}

.hero-photo{
  position:relative;
  max-width:680px;
  justify-self:center;
}

.hero-photo::before{
  content:"";
  position:absolute;
  inset:22px -18px -18px 22px;
  border:1px solid var(--line);
  border-radius:44px;
  opacity:.65;
  z-index:-1;
}

.hero-photo img{
  width:100%;
  height:min(72vh,680px);
  object-fit:cover;
  border-radius:40px;
  box-shadow:var(--shadow);
  cursor:pointer;
  animation:softFloat 6s ease-in-out infinite;
  transition:filter .45s ease, box-shadow .45s ease;
}

.hero-photo img:hover{
  filter:brightness(1.035) saturate(1.04);
  box-shadow:0 30px 78px rgba(90,70,50,.16);
}

.section{
  padding:118px 7vw;
  text-align:center;
}

.small-en{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--muted);
  letter-spacing:.25em;
  margin-bottom:18px;
}

.title{
  font-size:36px;
  font-weight:400;
  letter-spacing:.28em;
  margin-left:.28em;
}

.flower{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin:26px 0 66px;
}

.flower .line{
  width:44px;
  height:1px;
  background:var(--line);
}

.flower .dot{
  width:6px;
  height:6px;
  background:var(--muted);
  transform:rotate(45deg);
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-flow:dense;
  gap:30px;
  max-width:1160px;
  margin:auto;
}

.card{
  background:rgba(255,253,249,.86);
  padding:14px 14px 34px;
  box-shadow:0 18px 36px rgba(90,70,50,.08);
  border:1px solid rgba(222,212,200,.58);
  border-radius:28px;
  transition:transform .5s ease, box-shadow .5s ease;
  cursor:pointer;
  overflow:hidden;
}

.card.feature{
  grid-column:span 2;
  grid-row:span 2;
}

.photo-frame{
  overflow:hidden;
  border-radius:22px;
  background:var(--soft);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  transition:transform .75s ease, filter .75s ease;
}

.card.feature img{
  aspect-ratio:1/1.06;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 28px 60px rgba(90,70,50,.14);
}

.card:hover img{
  transform:scale(1.055);
  filter:brightness(1.04) saturate(1.04);
}

.card figcaption{
  margin-top:16px;
  color:var(--muted);
  font-size:14px;
  letter-spacing:.16em;
}

.letter{
  max-width:800px;
  margin:auto;
  background:rgba(255,253,249,.70);
  padding:64px 50px;
  border-radius:38px;
  border:1px solid rgba(222,212,200,.58);
  box-shadow:0 18px 46px rgba(90,70,50,.06);
  backdrop-filter:blur(4px);
}

.letter h3{
  font-size:28px;
  font-weight:400;
  letter-spacing:.24em;
  margin-bottom:42px;
}

.letter p{
  text-align:left;
  font-size:17px;
  line-height:2.35;
  letter-spacing:.06em;
}

.sign{
  margin-top:42px;
  text-align:right;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--muted);
  letter-spacing:.16em;
}

.lightbox{
  position:fixed;
  inset:0;
  background:rgba(48,40,34,.76);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:24px;
}

.lightbox.show{display:flex;}

.lightbox img{
  max-width:92vw;
  max-height:86vh;
  object-fit:contain;
  border-radius:28px;
  box-shadow:0 30px 90px rgba(0,0,0,.34);
  animation:breathe 5s ease-in-out infinite;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next{
  position:absolute;
  color:#fff;
  cursor:pointer;
  font-family:Arial,sans-serif;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(5px);
}

.lightbox-close{
  top:24px;
  right:30px;
  font-size:34px;
  line-height:1;
  width:48px;
  height:48px;
  border-radius:50%;
}

.lightbox-prev,
.lightbox-next{
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  font-size:30px;
}

.lightbox-prev{left:28px;}
.lightbox-next{right:28px;}

footer{
  padding:64px 20px;
  text-align:center;
  border-top:1px solid var(--line);
  color:var(--muted);
  letter-spacing:.22em;
}

footer strong{
  display:block;
  color:var(--ink);
  font-weight:400;
  font-size:20px;
  margin-bottom:12px;
}

@media(max-width:980px){
  .hero{
    grid-template-columns:1fr;
    padding:44px 26px 86px;
    gap:44px;
  }

  .hero-photo{order:1; max-width:620px;}
  .hero-text{order:2;}

  .hero-photo img{
    height:auto;
    max-height:none;
    aspect-ratio:1.22/1;
  }

  .label{margin-bottom:48px;}
  .name{font-size:76px;}
  .date{font-size:28px;}

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    max-width:720px;
  }

  .card{
    border-radius:24px;
    padding:10px 10px 28px;
  }

  .card.feature{
    grid-column:span 2;
    grid-row:span 1;
  }

  .card.feature img{
    aspect-ratio:1.35/1;
  }

  .section{
    padding:90px 22px;
  }

  .title{font-size:30px;}

  .letter{
    padding:44px 26px;
  }
}

@media(max-width:520px){
  .hero{
    padding:34px 20px 74px;
  }

  .hero-photo::before{
    inset:13px -8px -8px 13px;
    border-radius:32px;
  }

  .hero-photo img{
    border-radius:30px;
  }

  .name{
    font-size:66px;
    letter-spacing:.14em;
  }

  .tag,
  .label{
    letter-spacing:.26em;
  }

  .gallery{
    gap:14px;
  }

  .card figcaption{
    font-size:12px;
    letter-spacing:.08em;
  }

  .lightbox-prev,
  .lightbox-next{
    top:auto;
    bottom:24px;
  }
}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>

<body>

<div class="wrap">

  <section class="hero">

    <div class="hero-text reveal">
      <div class="label">FULL MOON · 彌月紀念</div>

      <div class="en">with all our love,</div>

      <h1 class="name">宇莃</h1>

      <div class="divider"></div>

      <div class="tag">滿 月 之 喜</div>

      <div class="date">2026 · 04 · 24</div>
    </div>

    <div class="hero-photo reveal" data-index="0">
      <img src="images/hero.jpg" alt="陳宇莃彌月照片">
    </div>

  </section>

  <section class="section">

    <div class="small-en reveal">Precious Moments</div>
    <h2 class="title reveal">珍 貴 時 刻</h2>

    <div class="flower reveal">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="line"></span>
    </div>

    <div class="gallery">
      <figure class="card reveal feature" data-index="0">
        <div class="photo-frame">
          <img src="images/photo01.jpg" alt="陳宇莃照片 01" loading="lazy">
        </div>
        <figcaption>N° 01 初來報到</figcaption>
      </figure>
      <figure class="card reveal" data-index="1">
        <div class="photo-frame">
          <img src="images/photo02.jpg" alt="陳宇莃照片 02" loading="lazy">
        </div>
        <figcaption>N° 02 安心入睡</figcaption>
      </figure>
      <figure class="card reveal" data-index="2">
        <div class="photo-frame">
          <img src="images/photo03.jpg" alt="陳宇莃照片 03" loading="lazy">
        </div>
        <figcaption>N° 03 小小微笑</figcaption>
      </figure>
      <figure class="card reveal" data-index="3">
        <div class="photo-frame">
          <img src="images/photo04.jpg" alt="陳宇莃照片 04" loading="lazy">
        </div>
        <figcaption>N° 04 滿月紀念</figcaption>
      </figure>
      <figure class="card reveal" data-index="4">
        <div class="photo-frame">
          <img src="images/photo05.jpg" alt="陳宇莃照片 05" loading="lazy">
        </div>
        <figcaption>N° 05 被愛包圍</figcaption>
      </figure>
      <figure class="card reveal feature" data-index="5">
        <div class="photo-frame">
          <img src="images/photo06.jpg" alt="陳宇莃照片 06" loading="lazy">
        </div>
        <figcaption>N° 06 幸福時光</figcaption>
      </figure>
      <figure class="card reveal" data-index="6">
        <div class="photo-frame">
          <img src="images/photo07.jpg" alt="陳宇莃照片 07" loading="lazy">
        </div>
        <figcaption>N° 07 甜甜夢鄉</figcaption>
      </figure>
      <figure class="card reveal" data-index="7">
        <div class="photo-frame">
          <img src="images/photo08.jpg" alt="陳宇莃照片 08" loading="lazy">
        </div>
        <figcaption>N° 08 溫柔凝望</figcaption>
      </figure>
      <figure class="card reveal" data-index="8">
        <div class="photo-frame">
          <img src="images/photo09.jpg" alt="陳宇莃照片 09" loading="lazy">
        </div>
        <figcaption>N° 09 宇莃日常</figcaption>
      </figure>
      <figure class="card reveal" data-index="9">
        <div class="photo-frame">
          <img src="images/photo10.jpg" alt="陳宇莃照片 10" loading="lazy">
        </div>
        <figcaption>N° 10 小手小腳</figcaption>
      </figure>
      <figure class="card reveal feature" data-index="10">
        <div class="photo-frame">
          <img src="images/photo11.jpg" alt="陳宇莃照片 11" loading="lazy">
        </div>
        <figcaption>N° 11 一家人的愛</figcaption>
      </figure>
      <figure class="card reveal" data-index="11">
        <div class="photo-frame">
          <img src="images/photo12.jpg" alt="陳宇莃照片 12" loading="lazy">
        </div>
        <figcaption>N° 12 滿滿祝福</figcaption>
      </figure>
    </div>

  </section>

  <section class="section">

    <div class="small-en reveal">A Letter from Me</div>

    <div class="letter reveal">
      <h3>致 愛 我 的 你</h3>

      <p>大家好，我是陳宇莃。<br><br>
        2026年4月24日，我帶著爸爸媽媽的期待與滿滿的愛，來到了這個世界。<br><br>
        雖然我還不太會說話，但我已經感受到每一份溫柔的陪伴與祝福。<br><br>
        謝謝你們陪我一起迎接人生的第一個月，願未來的每一天，我都能健康、平安、快樂地長大。</p>

      <div class="sign">— Yu Xi, 2026 spring</div>
    </div>

  </section>

  <footer>
    <strong>陳 宇 莃 · 彌 月 紀 念</strong>
    FULL MOON · 2026
  </footer>

</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="關閉">×</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="上一張">‹</button>
  <img id="lightboxImg" src="" alt="放大照片">
  <button class="lightbox-next" id="lightboxNext" aria-label="下一張">›</button>
</div>

<script>
const reveals = document.querySelectorAll('.reveal');
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('show');
      observer.unobserve(entry.target);
    }
  });
},{threshold:0.16});
reveals.forEach(el=>observer.observe(el));

const photos = [
  'images/hero.jpg',
  'images/photo01.jpg',
  'images/photo02.jpg',
  'images/photo03.jpg',
  'images/photo04.jpg',
  'images/photo05.jpg',
  'images/photo06.jpg',
  'images/photo07.jpg',
  'images/photo08.jpg',
  'images/photo09.jpg',
  'images/photo10.jpg',
  'images/photo11.jpg',
  'images/photo12.jpg'
];

let currentIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
const lightboxPrev = document.getElementById('lightboxPrev');
const lightboxNext = document.getElementById('lightboxNext');

function openLightbox(index){
  currentIndex = index;
  lightboxImg.src = photos[currentIndex];
  lightbox.classList.add('show');
}

function closeLightbox(){
  lightbox.classList.remove('show');
}

function changePhoto(step){
  currentIndex = (currentIndex + step + photos.length) % photos.length;
  lightboxImg.src = photos[currentIndex];
}

document.querySelector('.hero-photo').addEventListener('click',()=>openLightbox(0));
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('click',()=>openLightbox(Number(card.dataset.index)+1));
});

lightboxClose.addEventListener('click',closeLightbox);
lightboxPrev.addEventListener('click',()=>changePhoto(-1));
lightboxNext.addEventListener('click',()=>changePhoto(1));
lightbox.addEventListener('click',(e)=>{ if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown',(e)=>{
  if(!lightbox.classList.contains('show')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') changePhoto(-1);
  if(e.key === 'ArrowRight') changePhoto(1);
});
</script>

</body>
</html>
